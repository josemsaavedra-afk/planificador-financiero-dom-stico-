name: DOMUS 3 quality gate
on:
  push:
    branches: [domus-3.0]
  pull_request:
    branches: [domus-3.0]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run audit:security
      - uses: actions/upload-artifact@v4
        with:
          name: domus-3-preview
          path: dist/domus-3/
          if-no-files-found: error
